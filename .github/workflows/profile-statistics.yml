name: Profile statistics

on:
  schedule:
    - cron: "15 2 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "profile-summary-card-output/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

env:
  # Must be a PAT. The built-in GITHUB_TOKEN cannot see private contributions,
  # and falling back to it silently is what produced public-only numbers before.
  CARD_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify the token can see private contributions
        run: |
          if [ -z "$CARD_TOKEN" ]; then
            echo "::error::SUMMARY_GITHUB_TOKEN is not set; cards would report public activity only."
            exit 1
          fi
          read -r -d '' Q <<'GQL' || true
          query($l:String!){
            user(login:$l){
              contributionsCollection{
                contributionCalendar{ totalContributions }
                restrictedContributionsCount
                totalCommitContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          GQL
          payload=$(jq -nc --arg q "$Q" --arg l "${{ github.repository_owner }}" \
                     '{query:$q, variables:{l:$l}}')
          resp=$(curl -sS -H "Authorization: bearer $CARD_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "$payload" https://api.github.com/graphql)

          if [ "$(echo "$resp" | jq -r 'has("errors")')" = "true" ]; then
            echo "::error::GraphQL error: $(echo "$resp" | jq -r '.errors[0].message')"
            exit 1
          fi

          c=$(echo "$resp" | jq '.data.user.contributionsCollection')
          total=$(echo "$c" | jq -r '.contributionCalendar.totalContributions')
          priv=$(echo  "$c" | jq -r '.restrictedContributionsCount')

          {
            echo "| Metric | Value |"
            echo "| :--- | ---: |"
            echo "| Total contributions (last year) | $total |"
            echo "| ...of which private / restricted | $priv |"
            echo "| Commit contributions | $(echo "$c" | jq -r '.totalCommitContributions') |"
            echo "| Repositories contributed to | $(echo "$c" | jq -r '.totalRepositoriesWithContributedCommits') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$priv" = "0" ]; then
            echo "::warning::No private contributions counted. Check the PAT has 'repo' (classic) or private-repo read (fine-grained) access, and that 'Include private contributions on my profile' is enabled in profile settings."
          fi

      # Two passes, one per theme. AUTO_PUSH is off so a single commit lands
      # both sets instead of racing two pushes against each other.
      - name: Generate light-theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 2
          AUTO_PUSH: false
          THEME: github
          NAME: Issam Sayyaf
          # Linguist ranks by bytes on disk, not authorship: vendored and
          # generated web assets otherwise dominate the language cards.
          EXCLUDE: JavaScript,HTML,CSS,SCSS

      - name: Stash light-theme cards
        run: cp -r profile-summary-card-output "$RUNNER_TEMP/light"

      - name: Generate dark-theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 2
          AUTO_PUSH: false
          THEME: github_dark
          NAME: Issam Sayyaf
          EXCLUDE: JavaScript,HTML,CSS,SCSS

      - name: Merge both themes
        run: |
          cp -r profile-summary-card-output "$RUNNER_TEMP/dark"
          rm -rf profile-summary-card-output
          mkdir -p profile-summary-card-output
          cp -r "$RUNNER_TEMP/light/." profile-summary-card-output/
          cp -r "$RUNNER_TEMP/dark/."  profile-summary-card-output/
          find profile-summary-card-output -name '*.svg' | sort

      - name: Fail if a card is missing
        run: |
          missing=0
          for theme in github github_dark; do
            for card in 0-profile-details 1-repos-per-language \
                        2-most-commit-language 3-stats 4-productive-time; do
              f="profile-summary-card-output/$theme/$card.svg"
              if [ ! -s "$f" ]; then
                echo "::error::missing or empty: $f"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Commit refreshed cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --staged --quiet; then
            echo "Statistics unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile statistics [skip ci]"
          git push
