      <circle cx="128" cy="96" r="92" stroke="url(#accent)" stroke-width="2" opacity=".16" />
      <circle cx="128" cy="96" r="68" stroke="url(#accent)" stroke-width="2" opacity=".24" />
      <circle cx="128" cy="96" r="44" stroke="url(#accent)" stroke-width="2" opacity=".34" />
      <circle cx="128" cy="96" r="8" fill="url(#accent)" />
      <path d="M8 96H36L52 96L65 70L80 122L95 42L112 151L128 96L145 96L160 72L176 121L190 83L204 96H248"
