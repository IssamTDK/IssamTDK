    <g stroke="#FFFFFF" opacity=".045">
      <path d="M0 68H1280M0 136H1280M0 204H1280M0 272H1280" />
      <path d="M80 0V340M160 0V340M240 0V340M320 0V340M400 0V340M480 0V340M560 0V340M640 0V340M720 0V340M800 0V340M880 0V340M960 0V340M1040 0V340M1120 0V340M1200 0V340" />
    </g>

    <rect x="0" y="0" width="6" height="340" fill="url(#accent)" />

    <circle cx="82" cy="70" r="7" fill="url(#accent)" />
    <text x="104" y="76" class="eyebrow">SENSOR ALGORITHMS · EDGE INTELLIGENCE</text>

    <text x="76" y="168" class="name">ISSAM SAYYAF</text>
    <text x="80" y="212" class="role">SIGNAL PROCESSING · TINYML · EMBEDDED AI</text>
    <text x="80" y="258" class="meta">Senior Software Algorithms Engineer · TDK InvenSense · Grenoble, France</text>

    <rect x="80" y="292" width="176" height="4" rx="2" fill="url(#accent)" />
    <rect x="264" y="292" width="44" height="4" rx="2" fill="url(#accent)" opacity=".45" />

