    .meta { fill: #6B7280; font: 500 17px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: .4px; }
    .signal-label { fill: #4B5563; font: 700 14px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 2.2px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #090C12; }
      .panel { fill: #0F141D; stroke: #252D3A; }
      .grid { stroke: #FFFFFF; opacity: .05; }
      .name { fill: #F8FAFC; }
      .role { fill: #D1D5DB; }
      .meta { fill: #9CA3AF; }
