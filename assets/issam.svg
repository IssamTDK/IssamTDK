<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Issam Sayyaf — Signal Processing, TinyML and Embedded AI</title>
  <desc id="bannerDesc">A dark banner showing the name Issam Sayyaf, the focus areas signal processing, TinyML and embedded AI, and a stylized sensor waveform.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120" />
      <stop offset="1" stop-color="#111C33" />
    </linearGradient>
    <clipPath id="card">
      <rect width="1280" height="340" rx="24" />
    </clipPath>
  </defs>

  <style>
    .name  { fill: #F8FAFC; font: 800 62px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 1.5px; }
    .role  { fill: #CBD5E1; font: 600 21px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 2.6px; }
    .meta  { fill: #94A3B8; font: 500 16px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: .3px; }
    .eyebrow { fill: #7DD3FC; font: 700 13px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 2.6px; }
  </style>

  <g clip-path="url(#card)">
