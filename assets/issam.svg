<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Issam Sayyaf — Sensor Intelligence, TinyML and Edge AI</title>
  <desc id="desc">A professional TDK-blue, white and charcoal banner featuring the TDK corporate mark and a stylized sensor waveform.</desc>

  <defs>
